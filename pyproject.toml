[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxweave"
version = "0.1.0"
description = "Streaming speech language model components"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]
authors = [{name = "Chen Kaibin"}]
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.scripts]
voxweave = "voxweave.cli:main"
